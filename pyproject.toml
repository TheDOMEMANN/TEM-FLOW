[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "temflow"
dynamic = ["version"]
description = "Evidence-conditioned reconstruction of source-transient-destination mass-flow intervals"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Kibru Teshome Zeleke", email = "kibrutz2000@gmail.com"}]
dependencies = ["numpy>=1.24", "scipy>=1.11"]

[project.optional-dependencies]
validation = ["pandas>=2.0", "scikit-learn>=1.3", "requests>=2.31"]

[project.scripts]
temflow = "temflow.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
temflow = [
  "data/*.csv",
  "data/*.json",
  "data/*.geojson",
  "data/*.html",
  "data/patterns/*.csv",
  "data/patterns/*.json",
  "data/patterns/*.geojson",
  "data/patterns/reference_roads/*.json",
  "data/patterns/reference_roads/*.json.gz",
  "data/patterns/reference_waterbodies/*.geojson",
  "data/patterns/reference_waterbodies/*.zip",
]

[tool.setuptools.dynamic]
version = {attr = "temflow._version.VERSION"}
